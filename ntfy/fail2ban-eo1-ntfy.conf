# fail2ban for an EO1 ntfy server: an EO1 and the remote page never get these answers, abuse gets them fast.
#   400 not an EO1 message (filter) / 401, 403 no access / 404, 405 a path or method no EO1 uses / 411, 413 / 429 over
#   the per-network limits in server.yml.
# Install: this [Definition] part as /etc/fail2ban/filter.d/eo1-ntfy.conf, the [eo1-ntfy] part as
# /etc/fail2ban/jail.d/eo1-ntfy.local (fail2ban reads them by their names), then: fail2ban-client reload
#
# --- /etc/fail2ban/filter.d/eo1-ntfy.conf ---
[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]*\] "[A-Z]+ [^"]*" (?:400|401|403|404|405|411|413|429) \d+
ignoreregex = "GET /(?:favicon\.ico|robots\.txt) HTTP

# --- /etc/fail2ban/jail.d/eo1-ntfy.local ---
# [eo1-ntfy]
# enabled           = true
# filter            = eo1-ntfy
# logpath           = /var/log/nginx/ntfy.access.log
# port              = http,https
# backend           = auto
# maxretry          = 30
# findtime          = 10m
# bantime           = 6h
# bantime.increment = true
