# nginx in front of an ntfy server for EO1 live remotes. Replace ntfy.example.com, then: certbot --nginx -d ntfy.example.com
# Only what an EO1 and the remote page use gets through; every publish goes through eo1-ntfy-filter.py first.
upstream eo1_ntfy        { server 127.0.0.1:8097; }   # ntfy (server.yml: listen-http ":80", published on 127.0.0.1:8097)
upstream eo1_ntfy_filter { server 127.0.0.1:8098; }   # eo1-ntfy-filter.py
limit_conn_zone $binary_remote_addr zone=eo1_ntfy_conn:10m;
map $request_method $eo1_publish_to {
    OPTIONS  eo1_ntfy;                                 # CORS preflight: ntfy answers it
    default  eo1_ntfy_filter;
}

server {
    listen 443 ssl;
    server_name ntfy.example.com;
    # ssl_certificate lines: added by certbot

    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 3M;
    limit_conn eo1_ntfy_conn 20;                       # open streams per network: an EO1 and a few phones need 2-5
    access_log /var/log/nginx/ntfy.access.log;         # what fail2ban-eo1-ntfy.conf reads

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_request_buffering on;
    proxy_redirect off;
    proxy_connect_timeout 30s;
    proxy_send_timeout 3m;
    proxy_read_timeout 3m;                             # ntfy sends a keepalive every 45 s on open streams

    # publish: PUT/POST on /eo1-<topic>, checked by the filter
    location ~ "^/eo1-[A-Za-z0-9_-]{1,60}$" {
        limit_except PUT POST OPTIONS { deny all; }
        proxy_pass http://$eo1_publish_to;
    }
    # subscribe: the EO1 streams /json, the remote page /sse
    location ~ "^/eo1-[A-Za-z0-9_-]{1,60}/(json|sse)$" {
        limit_except GET OPTIONS { deny all; }
        proxy_pass http://eo1_ntfy;
    }
    # the larger messages (an album's small pictures) arrive as attachments
    location ^~ /file/ {
        limit_except GET OPTIONS { deny all; }
        proxy_pass http://eo1_ntfy;
    }
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    # everything else: an empty page (the front page) or nothing at all
    location = / {
        default_type text/plain;
        return 200 "";
    }
    location / {
        default_type text/plain;
        return 404 "";
    }
}

server {
    listen 80;
    server_name ntfy.example.com;
    return 301 https://$host$request_uri;
}
