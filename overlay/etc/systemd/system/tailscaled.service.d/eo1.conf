# EO1bian: Tailscale only when the owner turned remote access on (control page, "Remote access"). Its state lives
# on the gallery partition (the root is read-only + RAM), networking in user space (no TUN needed: incoming
# connections go to the EO1's own ports), and no log upload (fewer writes to the eMMC).
[Unit]
ConditionPathExists=/media/eo1gallery/tailscale/enabled
After=media-eo1gallery.mount
RequiresMountsFor=/media/eo1gallery

[Service]
ExecStart=
ExecStart=/usr/sbin/tailscaled --statedir=/media/eo1gallery/tailscale --socket=/run/tailscale/tailscaled.sock --tun=userspace-networking --port=${PORT} --no-logs-no-support $FLAGS
