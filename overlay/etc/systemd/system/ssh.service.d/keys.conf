[Unit]
# SSH only when someone put a login key on the EO1 (ssh/authorized_keys on the stick or boot partition, or
# one built into a private image); passwords are off, so without a key there is nothing to log in with
ConditionFileNotEmpty=/home/eo1/.ssh/authorized_keys

[Service]
ExecStartPre=
ExecStartPre=/usr/local/bin/eo1-ssh-keys
ExecStartPre=/usr/sbin/sshd -t
