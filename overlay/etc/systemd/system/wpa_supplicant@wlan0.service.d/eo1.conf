[Unit]
# the config is generated by eo1-config from the saved profile on the boot partition. Starts as soon as wlan0
# exists (no wait for basic.target: that cost 5 s), the frame's only network
DefaultDependencies=no
After=eo1-config.service sys-subsystem-net-devices-wlan0.device
Requires=eo1-config.service
ConditionPathExists=!/run/eo1-nm-on

[Service]
Nice=-2
Restart=always
RestartSec=5
