[connection]
# Wi-Fi power saving makes the TI WL1271 slow to answer: keep it off on a wall frame
wifi.powersave=2

[device]
# no random MAC while scanning: saves a firmware restart of the WL1271 at every boot
wifi.scan-rand-mac-address=no

[keyfile]
# the EO board has an Ethernet PHY that reports "link up" with no jack, and a CAN controller: NetworkManager
# would wait for DHCP on eth0 forever (network-online took 60 s)
unmanaged-devices=interface-name:eth0;interface-name:can0
